<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Customer Account | PrivacyLock</title><link rel="stylesheet" href="css/styles.css"></head><body><main class="form-wrap"><section class="form-card"><a class="brand" href="index.html"><span class="brand-mark">P</span>PrivacyLock</a><h1>Create your account</h1><p>Register to use the customer demo portal.</p><form data-register-form><div class="field"><label for="name">Full name</label><input id="name" required autocomplete="name"></div><div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="phone">Phone (optional)</label><input id="phone" type="tel" autocomplete="tel"></div><div class="field"><label for="password">Password (at least 8 characters)</label><input id="password" type="password" required minlength="8" autocomplete="new-password"></div><div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" required minlength="8" autocomplete="new-password"></div><div class="field"><label><input type="checkbox" required> I agree to the prototype privacy notice.</label></div><div id="form-message" class="hidden" role="status"></div><button class="btn" type="submit">Create Account</button></form><div class="form-links"><a href="index.html">← Home</a><a href="customer-login.html">Already registered?</a></div></section></main><script src="js/main.js"></script><script src="js/auth.js"></script></body></html>
